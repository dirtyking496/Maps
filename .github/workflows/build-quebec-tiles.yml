name: Build XIO GPS Quebec offline routing pack
concurrency:
  group: xio-quebec-map-pack-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/quebec-offline-navigation
    paths:
      - .github/workflows/build-quebec-tiles.yml
  schedule:
    - cron: "0 8 1 * *"

permissions:
  contents: read

jobs:
  build-quebec-routing-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Download Quebec OpenStreetMap source
        run: |
          set -euo pipefail
          wget --https-only --continue --show-progress \
            https://download.geofabrik.de/north-america/canada/quebec-latest.osm.pbf \
            -O quebec-latest.osm.pbf
          ls -lh quebec-latest.osm.pbf
          df -h

      - name: Build Valhalla routing tiles and databases
        run: |
          set -euo pipefail
          mkdir -p valhalla_tiles
          docker pull ghcr.io/valhalla/valhalla-dev:3.9.0
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -w /data \
            ghcr.io/valhalla/valhalla-dev:3.9.0 \
            bash -lc '
              set -euo pipefail
              valhalla_build_config \
                --mjolnir-tile-dir /data/valhalla_tiles \
                --mjolnir-tile-extract /data/valhalla_tiles/valhalla_tiles.tar \
                --mjolnir-timezone /data/valhalla_tiles/timezones.sqlite \
                --mjolnir-admin /data/valhalla_tiles/admin.sqlite \
                > /data/valhalla.json
              valhalla_build_timezones > /data/valhalla_tiles/timezones.sqlite
              valhalla_build_admins -c /data/valhalla.json /data/quebec-latest.osm.pbf
              valhalla_build_tiles -c /data/valhalla.json /data/quebec-latest.osm.pbf
              valhalla_build_extract -c /data/valhalla.json -v
            '
          test -s valhalla_tiles/valhalla_tiles.tar
          test -s valhalla_tiles/admin.sqlite
          test -s valhalla_tiles/timezones.sqlite
          df -h

      - name: Download Planetiler water polygons from mirror
        run: |
          set -euo pipefail
          downloaded=false
          for mirror_root in \
            "https://ftp.fau.de/mirrors/openstreetmapdata.com-archive" \
            "https://ftp.fau.de/pub/openstreetmapdata.com-archive"; do
            echo "Checking dated mirror folders at ${mirror_root}/"
            listing="$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 30 \
              "${mirror_root}/")"
            while IFS= read -r mirror_date; do
              [ -n "${mirror_date}" ] || continue
              water_url="${mirror_root}/${mirror_date}/water-polygons-split-3857.zip"
              echo "Checking ${water_url}"
              if ! curl --fail --silent --show-error --head --location \
                --connect-timeout 20 --max-time 30 "${water_url}" >/dev/null; then
                echo "No water-polygons archive in ${mirror_date}; trying the previous mirror snapshot."
                continue
              fi
              echo "Downloading water polygons from ${water_url}"
              if curl --fail --show-error --location --retry 6 --retry-all-errors \
                --retry-delay 10 --connect-timeout 30 --continue-at - \
                "${water_url}" -o water-polygons-split-3857.zip \
                && unzip -t water-polygons-split-3857.zip; then
                downloaded=true
                break
              fi
              rm -f water-polygons-split-3857.zip
              echo "Download or ZIP validation failed for ${water_url}; trying another snapshot."
            done < <(printf '%s\n' "${listing}" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}/' | tr -d '/' | sort -r)
            [ "${downloaded}" = true ] && break
          done
          if [ "${downloaded}" != true ]; then
            echo "Unable to download a valid water-polygons-split-3857.zip from the FAU mirrors."
            exit 1
          fi
          test -s water-polygons-split-3857.zip
          ls -lh water-polygons-split-3857.zip
          df -h

      - name: Build Quebec offline vector map tiles
        run: |
          set -euo pipefail
          docker pull ghcr.io/onthegomap/planetiler:latest
          attempt=1
          max_attempts=3
          until docker run --rm \
            -e JAVA_TOOL_OPTIONS="-Xmx2g" \
            -v "${{ github.workspace }}:/data" \
            -w /data \
            ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/quebec-latest.osm.pbf \
            --water-polygons-path=/data/water-polygons-split-3857.zip \
            --download \
            --output=/data/quebec.pmtiles \
            --force \
            --building-merge-z13=false \
            --storage=mmap; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Planetiler failed after ${max_attempts} attempts; see the error above."
                exit 1
              fi
              echo "Planetiler attempt ${attempt} failed; retrying with the downloaded water-polygons file..."
              attempt=$((attempt + 1))
              sleep 45
          done
          test -s quebec.pmtiles
          ls -lh quebec.pmtiles
          df -h

      - name: Package XIO GPS offline map data
        run: |
          set -euo pipefail
          zip -0 -j xio-quebec-offline-pack.zip \
            valhalla_tiles/valhalla_tiles.tar \
            valhalla_tiles/admin.sqlite \
            valhalla_tiles/timezones.sqlite \
            quebec.pmtiles
          unzip -t xio-quebec-offline-pack.zip
          for required in valhalla_tiles.tar admin.sqlite timezones.sqlite quebec.pmtiles; do
            unzip -Z1 xio-quebec-offline-pack.zip | grep -Fxq "${required}"
          done
          ls -lh xio-quebec-offline-pack.zip

      - name: Upload Quebec offline map pack
        uses: actions/upload-artifact@v4
        with:
          name: XIO-GPS-Quebec-Offline-Map-Pack
          path: xio-quebec-offline-pack.zip
          if-no-files-found: error
          retention-days: 30
