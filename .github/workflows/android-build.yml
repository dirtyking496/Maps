name: Build XIO GPS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/quebec-offline-navigation ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK with offline routing engine
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XIO-GPS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
